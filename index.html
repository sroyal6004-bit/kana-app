<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#12141f"/>
<link rel="icon" href="data:,"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<title>가나 · 여행 단어 연습</title>
<!-- 기기 간 동기화(선택): Firebase. 오프라인이면 로드 실패해도 앱은 그대로 동작 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<style>
:root{
  --bg:#12141f; --bg2:#181a27; --card:#1f2231; --card2:#262a3c;
  --ink:#eef0f7; --ink2:#a6adc4; --ink3:#6d7592;
  --teal:#57d2c8; --teal-d:#2f9a92;
  --coral:#e8785f; --coral-d:#c85a44;
  --gold:#e6b455; --good:#5ec98a; --bad:#e46a6a;
  --line:#2d3245; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overscroll-behavior-y:none}
body{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(84px + env(safe-area-inset-bottom));}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.jp{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,'Noto Sans JP','Noto Sans CJK JP',sans-serif}

header{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 10px 18px -12px rgba(0,0,0,.75);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{font-size:20px;font-weight:800;letter-spacing:-.3px}
.htitle small{font-weight:600;color:var(--ink3);font-size:13px;margin-left:6px}
.gear{margin-left:auto;width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.stat .k{font-size:11px;color:var(--ink3);font-weight:600}
.stat .v{font-size:19px;font-weight:800;margin-top:2px}
.stat .v small{font-size:12px;color:var(--ink3);font-weight:600}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);transition:.12s}
.chip.on{background:var(--teal-d);border-color:var(--teal);color:#fff}
.chip.coral.on{background:var(--coral-d);border-color:var(--coral)}
.chip.gold.on{background:#8a6a24;border-color:var(--gold);color:#fff}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--card2);color:var(--ink)}
.deckseg{width:100%;justify-content:stretch;margin-top:12px}
.deckseg button{flex:1;text-align:center;padding:9px}
.deckseg button.on{background:linear-gradient(90deg,var(--teal-d),#3a7f8f);color:#fff}

main{padding:6px 16px 20px}

/* table */
.tbl-head{display:flex;align-items:center;gap:10px;margin:14px 2px 8px}
.tbl-head h3{margin:0;font-size:15px;font-weight:800}
.tbl-head .cnt{font-size:12px;color:var(--ink3);font-weight:700}
table.kana{width:100%;border-collapse:separate;border-spacing:6px}
table.kana td{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px;position:relative;min-height:58px;vertical-align:middle}
table.kana td.empty{background:transparent;border:none}
table.kana td.done{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal-d)}
td .cg{font-size:22px;font-weight:700;line-height:1}
td .cg-both{font-size:17px;font-weight:700;line-height:1.25}
td .cg-both.k{color:var(--ink2)}
td .cr{font-size:11px;color:var(--ink2);margin-top:3px;font-weight:700}
td .ck{font-size:10px;color:var(--ink3);margin-top:1px}
td .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%}
td.hidden .cr,td.hidden .ck{visibility:hidden}

/* travel list */
.wcard{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;position:relative}
.wcard.done{border-color:var(--teal)}
.wl{flex:1;min-width:0}
.wj{font-size:21px;font-weight:800;line-height:1.2}
.wy{font-size:13px;color:var(--ink3);margin-top:3px}
.wr{text-align:right;flex-shrink:0;max-width:48%}
.wrom{display:block;font-size:13px;color:var(--teal);font-weight:700}
.wko{display:block;font-size:15px;color:var(--ink);font-weight:700;margin-top:3px}
.wcard.hidden .wko{visibility:hidden}
.wcard .dot{position:absolute;top:8px;left:8px;width:6px;height:6px;border-radius:50%}
.wspk{font-size:16px;color:var(--ink3);padding:4px}
.srec-intro{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0 14px;font-size:13px;color:var(--ink2);line-height:1.6}
.srec-intro .srec-h{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:6px}
.srec-intro p{margin:4px 0}
.srec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.srec-top{display:flex;align-items:center;gap:8px}
.srec-name{font-size:19px;font-weight:800;flex:1;line-height:1.25}
.srec-star{color:var(--gold);margin-left:4px}
.srec-read{font-size:13px;color:var(--ink3);margin-top:3px}
.srec-meta{font-size:13px;color:var(--ink2);margin-top:7px;font-weight:600}
.srec-chip{display:inline-block;background:var(--card2);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:6px;font-weight:700}
.srec-note{font-size:13px;color:var(--gold);margin-top:6px;font-weight:700}

/* flash */
.flashwrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:20px}
.flip{width:100%;max-width:330px;aspect-ratio:1/1;perspective:1200px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;background:var(--card);border:1px solid var(--line)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card2),var(--card))}
.face .big{font-weight:800;line-height:1.15;word-break:keep-all}
.face .sub{font-size:20px;color:var(--ink2);margin-top:10px;font-weight:700}
.face .line{font-size:17px;color:var(--teal);margin-top:12px;font-weight:700}
.face .hint{position:absolute;bottom:16px;font-size:12px;color:var(--ink3)}
.spk{position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:18px}
.starbtn{position:absolute;top:14px;left:16px;width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:23px;line-height:1;color:var(--ink3);z-index:3}
.starbtn.on{color:var(--gold)}
.wstar{flex-shrink:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:21px;line-height:1;color:var(--ink3);background:var(--card2)}
.wstar.on{color:var(--gold)}
.fbtns{display:flex;gap:12px;width:100%;max-width:330px}
.fbtns button{flex:1;padding:15px;border-radius:16px;font-size:16px;font-weight:800}
.b-no{background:var(--card2);color:var(--ink2)}
.b-yes{background:var(--teal-d);color:#fff}
.tap-h{font-size:13px;color:var(--ink3)}

/* quiz */
.quizwrap{margin-top:16px}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qprompt{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 16px;text-align:center;margin-bottom:16px}
.qprompt .q{font-size:56px;font-weight:800;line-height:1.15;word-break:keep-all}
.qprompt .q.small{font-size:34px}
.qprompt .qy{font-size:16px;color:var(--ink3);margin-top:8px;font-weight:700}
.qprompt .sub{font-size:13px;color:var(--ink3);margin-top:10px;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{padding:16px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;transition:.12s;min-height:60px;word-break:keep-all}
.choice.jp{font-size:26px}
.choice.ok{background:var(--teal-d);border-color:var(--good);color:#fff}
.choice.no{background:#3a2530;border-color:var(--bad);color:#ffb4b4}
.choice:disabled{opacity:.6}
.qmeta{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--ink3);font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;max-width:560px;margin:0 auto;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink3)}
nav button .ic{font-size:20px}
nav button.on{color:var(--teal)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.25s}
.sheet.show{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 12px}
.sheet h3{margin:6px 0 4px;font-size:16px;font-weight:800}
.srow{padding:14px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}
.srow .lab{font-size:14px;font-weight:700;margin-bottom:9px}
.linkbtn{padding:12px 14px;border-radius:12px;background:var(--card);font-weight:700;font-size:14px;width:100%;text-align:left;border:1px solid var(--line);margin-top:8px}
.linkbtn.danger{color:#ffb4b4}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.empty-msg{text-align:center;color:var(--ink3);padding:60px 20px;font-weight:700;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="htitle" id="hTitle">가나 연습<small id="hSub">ひらがな · カタカナ</small></div>
    <button class="gear" id="gear" aria-label="설정">⚙️</button>
  </div>
  <div class="stats" id="statsRow">
    <div class="stat"><div class="k" id="stLabel">익힌 글자</div><div class="v"><span id="stMaster">0</span><small id="stTotal">/0</small></div>
      <div class="bar"><i id="stBar" style="width:0%"></i></div></div>
    <div class="stat"><div class="k">정답률</div><div class="v" id="stAcc">–</div>
      <div class="bar"><i id="stAccBar" style="width:0%;background:linear-gradient(90deg,var(--coral),var(--gold))"></i></div></div>
  </div>
  <div class="seg deckseg" id="deckSeg">
    <button data-deck="kana" class="on">가나</button>
    <button data-deck="travel">여행 단어</button>
    <button data-deck="sakerec">추천 술</button>
  </div>
  <div id="kanaChips">
    <div class="chips" id="scriptChips">
      <button class="chip" data-sc="hira">히라가나</button>
      <button class="chip" data-sc="kata">가타카나</button>
      <button class="chip" data-sc="both">둘 다</button>
    </div>
    <div class="chips" id="setChips">
      <button class="chip coral" data-set="gojuon">청음</button>
      <button class="chip coral" data-set="dakuten">탁음·반탁음</button>
      <button class="chip coral" data-set="yoon">요음</button>
    </div>
  </div>
  <div id="travelChips" style="display:none">
    <div class="chips" id="catChips"></div>
  </div>
  <div class="chips" id="starRow" style="margin-top:8px">
    <button class="chip gold" id="starChip">⭐ 즐겨찾기만 보기</button>
  </div>
</header>

<main id="main"></main>

<nav id="nav">
  <button data-mode="table" class="on"><span class="ic" id="ic0">📋</span><span id="lb0">표</span></button>
  <button data-mode="flash"><span class="ic">🎴</span>플래시</button>
  <button data-mode="quiz"><span class="ic">✏️</span>퀴즈</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>설정</h3>
  <div class="srow">
    <div class="lab">📱 ↔ 💻 기기 간 동기화</div>
    <div id="syncStatus" style="font-size:13px;font-weight:700;margin-bottom:9px;color:var(--ink3)">이 기기에만 저장 중</div>
    <input id="syncCode" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="연결 코드 (예: mina-japan-2026)"
      style="width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:700;-webkit-appearance:none"/>
    <button class="linkbtn" id="btnConnect">🔗 이 코드로 연결하기</button>
    <button class="linkbtn" id="btnMakeCode">✨ 새 코드 자동 생성</button>
    <button class="linkbtn danger" id="btnDisconnect" style="display:none">🔌 동기화 끄기 (이 기기만)</button>
    <div style="font-size:12px;color:var(--ink3);line-height:1.6;margin-top:9px">
      PC와 폰에 <b style="color:var(--ink2)">같은 코드</b>를 넣으면 진도가 실시간으로 함께 저장돼요.
      한쪽에서 공부하면 다른 쪽에도 바로 반영됩니다. 코드가 곧 비밀번호이니
      남이 추측하기 어렵게 정하세요(6자 이상).
    </div>
  </div>
  <div class="srow">
    <div class="lab">가나 퀴즈 방향</div>
    <div class="seg" id="dirSeg">
      <button data-dir="k2r" class="on">가나 → 로마자</button>
      <button data-dir="r2k">로마자 → 가나</button>
    </div>
  </div>
  <div class="srow">
    <div class="lab">복습 우선</div>
    <div class="seg" id="revSeg">
      <button data-rev="0" class="on">전체 연습</button>
      <button data-rev="1">익힌 것 숨기기</button>
    </div>
  </div>
  <div class="srow">
    <div class="lab">진도 관리</div>
    <button class="linkbtn" id="btnExport">📤 진도 백업 (JSON 내보내기)</button>
    <button class="linkbtn" id="btnImport">📥 백업 불러오기</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none"/>
    <button class="linkbtn danger" id="btnReset">🗑️ 진도 초기화</button>
  </div>
  <div class="srow" style="color:var(--ink3);font-size:12px;line-height:1.6">
    맞히면 익힘 단계가 오르고, 틀리면 그 항목이 더 자주 나와요. 4번 연속 맞히면 “익힘”으로 표시됩니다.
    진도는 가나·여행 단어 공통으로 저장돼요.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ KANA DATA ============ */
const C=(h,k,r,ko)=>({h,k,r,ko});const _=null;
const GOJUON=[
 [C('あ','ア','a','아'),C('い','イ','i','이'),C('う','ウ','u','우'),C('え','エ','e','에'),C('お','オ','o','오')],
 [C('か','カ','ka','카'),C('き','キ','ki','키'),C('く','ク','ku','쿠'),C('け','ケ','ke','케'),C('こ','コ','ko','코')],
 [C('さ','サ','sa','사'),C('し','シ','shi','시'),C('す','ス','su','스'),C('せ','セ','se','세'),C('そ','ソ','so','소')],
 [C('た','タ','ta','타'),C('ち','チ','chi','치'),C('つ','ツ','tsu','츠'),C('て','テ','te','테'),C('と','ト','to','토')],
 [C('な','ナ','na','나'),C('に','ニ','ni','니'),C('ぬ','ヌ','nu','누'),C('ね','ネ','ne','네'),C('の','ノ','no','노')],
 [C('は','ハ','ha','하'),C('ひ','ヒ','hi','히'),C('ふ','フ','fu','후'),C('へ','ヘ','he','헤'),C('ほ','ホ','ho','호')],
 [C('ま','マ','ma','마'),C('み','ミ','mi','미'),C('む','ム','mu','무'),C('め','メ','me','메'),C('も','モ','mo','모')],
 [C('や','ヤ','ya','야'),_,C('ゆ','ユ','yu','유'),_,C('よ','ヨ','yo','요')],
 [C('ら','ラ','ra','라'),C('り','リ','ri','리'),C('る','ル','ru','루'),C('れ','レ','re','레'),C('ろ','ロ','ro','로')],
 [C('わ','ワ','wa','와'),_,_,_,C('を','ヲ','wo','오')],
 [C('ん','ン','n','응'),_,_,_,_],
];
const DAKUTEN=[
 [C('が','ガ','ga','가'),C('ぎ','ギ','gi','기'),C('ぐ','グ','gu','구'),C('げ','ゲ','ge','게'),C('ご','ゴ','go','고')],
 [C('ざ','ザ','za','자'),C('じ','ジ','ji','지'),C('ず','ズ','zu','즈'),C('ぜ','ゼ','ze','제'),C('ぞ','ゾ','zo','조')],
 [C('だ','ダ','da','다'),C('ぢ','ヂ','ji','지'),C('づ','ヅ','zu','즈'),C('で','デ','de','데'),C('ど','ド','do','도')],
 [C('ば','バ','ba','바'),C('び','ビ','bi','비'),C('ぶ','ブ','bu','부'),C('べ','ベ','be','베'),C('ぼ','ボ','bo','보')],
 [C('ぱ','パ','pa','파'),C('ぴ','ピ','pi','피'),C('ぷ','プ','pu','푸'),C('ぺ','ペ','pe','페'),C('ぽ','ポ','po','포')],
];
const YOON=[
 [C('きゃ','キャ','kya','캬'),C('きゅ','キュ','kyu','큐'),C('きょ','キョ','kyo','쿄')],
 [C('しゃ','シャ','sha','샤'),C('しゅ','シュ','shu','슈'),C('しょ','ショ','sho','쇼')],
 [C('ちゃ','チャ','cha','차'),C('ちゅ','チュ','chu','추'),C('ちょ','チョ','cho','초')],
 [C('にゃ','ニャ','nya','냐'),C('にゅ','ニュ','nyu','뉴'),C('にょ','ニョ','nyo','뇨')],
 [C('ひゃ','ヒャ','hya','햐'),C('ひゅ','ヒュ','hyu','휴'),C('ひょ','ヒョ','hyo','효')],
 [C('みゃ','ミャ','mya','먀'),C('みゅ','ミュ','myu','뮤'),C('みょ','ミョ','myo','묘')],
 [C('りゃ','リャ','rya','랴'),C('りゅ','リュ','ryu','류'),C('りょ','リョ','ryo','료')],

function pool(){

      for(const row of SETS[sk].grid)for(const c of row){ if(!c)continue;

          out.push({key:disp,disp,sub:'',r:c.r,ko:c.ko,say:c.h,grp:sk});}}}
  }else{
    for(const wd of TRAVEL){ if(!cfg.cats[wd.cat])continue;
      out.push({key:wd.jp,disp:wd.jp,sub:(wd.jp===wd.y?'':wd.y),r:wd.r,ko:wd.ko,say:wd.y,grp:wd.cat});}
  }
  return cfg.starOnly?out.filter(x=>isStar(x.key)):out;
}
function activePool(){let p=pool();if(cfg.rev){const f=p.filter(x=>!isMaster(x.key));if(f.length>=4)return f;}return p;}
function weight(x){const p=progress[x.key];if(!p||p.s===0)return 6;return Math.max(1,Math.min(12,1+p.w*3-p.st));}
function pickWeighted(list,avoid){const cand=list.length>1&&avoid?list.filter(x=>x.key!==avoid):list;
  let tot=0;const ws=cand.map(x=>{const w=weight(x);tot+=w;return w;});let r=Math.random()*tot;
  for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0)return cand[i];}return cand[cand.length-1];}

function loadVoices(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];jaVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'))||null;}

/* stats */
function refreshStats(){
  const p=pool();const total=p.length;const master=p.filter(x=>isMaster(x.key)).length;
  let c=0,w=0;for(const x of p){const pr=progress[x.key];if(pr){c+=pr.c;w+=pr.w;}}
  document.getElementById('stLabel').textContent=cfg.deck==='kana'?'익힌 글자':'익힌 단어';
  stMaster.textContent=master;stTotal.textContent='/'+total;stBar.style.width=(total?master/total*100:0)+'%';
  const acc=c+w>0?Math.round(c/(c+w)*100):null;stAcc.textContent=acc===null?'–':acc+'%';stAccBar.style.width=(acc||0)+'%';
}

/* ===== TABLE (kana) ===== */
function renderTable(){
  if(cfg.starOnly){renderStarCards(pool());return;}
  const sc=cfg.script; // hira | kata | both
  const activeSets=Object.keys(SETS).filter(s=>cfg.sets[s]);
  if(!activeSets.length){main.innerHTML='<div class="empty-msg">위에서 연습할 세트를 하나 이상 골라 주세요 🙂</div>';return;}
  let html='';
  for(const sk of activeSets){const g=SETS[sk].grid;let cells=0;let t='<table class="kana"><tbody>';
    for(const row of g){t+='<tr>';for(const c of row){if(!c){t+='<td class="empty"></td>';continue;}cells++;
      let inner,keys,done,dc;
      if(sc==='both'){keys=[c.h,c.k];const ph=progress[c.h],pk=progress[c.k];
        done=isMaster(c.h)&&isMaster(c.k);
        const anyWrong=(ph&&ph.w>ph.c)||(pk&&pk.w>pk.c),anySeen=(ph&&ph.s)||(pk&&pk.s);
        dc=done?'var(--teal)':(anyWrong?'var(--coral)':(anySeen?'var(--gold)':'transparent'));
        inner=`<div class="cg-both jp">${c.h}</div><div class="cg-both k jp">${c.k}</div><div class="cr">${c.r}</div><div class="ck">${c.ko}</div>`;
      }else{const disp=sc==='kata'?c.k:c.h;keys=[disp];const p=progress[disp];done=isMaster(disp);
        dc=done?'var(--teal)':(p&&p.w>p.c?'var(--coral)':(p&&p.s?'var(--gold)':'transparent'));
        inner=`<div class="cg jp">${disp}</div><div class="cr">${c.r}</div><div class="ck">${c.ko}</div>`;
      }
      t+=`<td class="hidden ${done?'done':''}" data-keys="${keys.join('|')}" data-say="${c.h}"><span class="dot" style="background:${dc}"></span>${inner}</td>`;}
      t+='</tr>';}
    t+='</tbody></table>';
    const label=sc==='both'?'자 · 히라+가타 · 탭하면 읽기·발음':'자 · 탭하면 읽기·발음';
    html+=`<div class="tbl-head"><h3>${SETS[sk].name}</h3><span class="cnt">${cells}${label}</span></div>`+t;}
  main.innerHTML=html;
  main.querySelectorAll('td[data-keys]').forEach(td=>td.onclick=()=>{const rev=!td.classList.contains('hidden');td.classList.toggle('hidden');say(td.dataset.say);
    if(!rev){td.dataset.keys.split('|').forEach(k=>{const p=getP(k);p.s++;p.u=Date.now();});save();refreshStats();syncPush();}});
}

let quizCur=null,quizStreak=0,quizDone=0;
function quizFields(){
  if(cfg.deck==='kana'){const k2r=cfg.dir==='k2r';
    return{pf:k2r?'disp':'r',af:k2r?'r':'disp',pJP:k2r,aJP:!k2r,sub:k2r?'이 글자의 로마자 발음은?':'이 발음의 글자는?',

    segs:[['j2k','일본어→뜻'],['k2j','뜻→일본어']],cur:cfg.tdir,set:v=>cfg.tdir=v};

function renderQuiz(){
  const list=activePool();
  if(list.length<4){main.innerHTML='<div class="empty-msg">퀴즈는 항목이 4개 이상 필요해요.<br>세트·카테고리를 더 켜 주세요.</div>';return;}
  const f=quizFields();
  main.innerHTML=`<div class="quizwrap">
    <div class="qbar"><div class="seg" id="qDir">${f.segs.map(([v,l])=>`<button data-dir="${v}" class="${f.cur===v?'on':''}">${l}</button>`).join('')}</div>

    <div class="qprompt"><div class="q" id="qQ"></div><div class="qy" id="qY"></div><div class="sub" id="qSub"></div></div>
    <div class="choices" id="qChoices"></div>
    <div class="qmeta"><span id="qStreak">연속 0</span><span id="qCount">푼 문제 0</span></div></div>`;
  qDir.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.set(b.dataset.dir);save();renderQuiz();});
  qSpk.onclick=()=>{if(quizCur)say(quizCur.say);};
  nextQuiz();
}
function nextQuiz(){
  const list=activePool();const f=quizFields();quizCur=pickWeighted(list,quizCur&&quizCur.key);
  const set=new Set([quizCur[f.af]]);const opts=[quizCur];let g=0;
  while(opts.length<4&&g++<300){const c=list[Math.floor(Math.random()*list.length)];const a=c[f.af];if(set.has(a))continue;set.add(a);opts.push(c);}
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  const qEl=document.getElementById('qQ'),yEl=document.getElementById('qY'),subEl=document.getElementById('qSub');
  const promptTxt=quizCur[f.pf];
  qEl.className='q '+(f.pJP?'jp ':'')+((f.pJP&&promptTxt.length>5)?'small':'');
  qEl.textContent=promptTxt;
  yEl.textContent=(cfg.deck==='travel'&&f.pJP&&quizCur.sub)?quizCur.sub:'';
  subEl.textContent=f.sub;
  const box=document.getElementById('qChoices');box.innerHTML='';
  for(const o of opts){const b=document.createElement('button');b.className='choice '+(f.aJP?'jp':'');b.textContent=o[f.af];b.dataset.k=o.key;b.onclick=()=>answer(b,o);box.appendChild(b);}
}
function answer(btn,opt){
  const f=quizFields();const box=document.getElementById('qChoices');const correct=opt.key===quizCur.key;
  const p=getP(quizCur.key);p.s++;if(correct){p.c++;p.st++;quizStreak++;}else{p.w++;p.st=0;quizStreak=0;}p.u=Date.now();
  save();refreshStats();syncPush();say(quizCur.say);
  [...box.children].forEach(b=>{b.disabled=true;if(b.dataset.k===quizCur.key)b.classList.add('ok');});
  if(!correct)btn.classList.add('no');
  quizDone++;document.getElementById('qStreak').textContent='연속 '+quizStreak;document.getElementById('qCount').textContent='푼 문제 '+quizDone;
  setTimeout(nextQuiz,correct?550:1150);
}

/* back-button layers */
const uiStack=[];
function pushHist(tag){try{history.pushState({t:tag},'');return true;}catch{return false;}}
function openSheet(){document.getElementById('scrim').classList.add('show');document.getElementById('sheet').classList.add('show');uiStack.push({tag:'sheet',pushed:pushHist('sheet')});}
function closeSheetDom(){document.getElementById('scrim').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
function uiBack(){const t=uiStack[uiStack.length-1];if(!t)return;if(t.pushed)history.back();else{uiStack.pop();closeSheetDom();}}
window.addEventListener('popstate',()=>{if(!uiStack.length)return;const t=uiStack.pop();if(t.tag==='sheet')closeSheetDom();});

/* backup */
btnExport.onclick=()=>{const data={app:'kana',v:3,exported:Date.now(),progress,stars,cfg};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kana-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('백업 파일을 내보냈어요');};
btnImport.onclick=()=>fileImport.click();
fileImport.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.progress){for(const k in d.progress){const a=progress[k]||{s:0,c:0,w:0,st:0};const b=d.progress[k];
    progress[k]={s:Math.max(a.s,b.s||0),c:Math.max(a.c,b.c||0),w:Math.max(a.w,b.w||0),st:Math.max(a.st,b.st||0),u:Date.now()};}}
    if(d.stars){for(const k in d.stars){const b=d.stars[k]||{};const a=stars[k];const bu=b.u||0,au=a?(a.u||0):0;if(!a||bu>=au)stars[k]={v:b.v?1:0,u:bu||Date.now()};}}
    if(d.cfg){const keepCode=cfg.syncCode;cfg=Object.assign(cfg,d.cfg);cfg.syncCode=keepCode;}save();buildCatChips();syncChips();render();syncPush();toast('백업을 불러왔어요');}catch{toast('파일을 읽을 수 없어요');}};
  rd.readAsText(file);fileImport.value='';};
btnReset.onclick=()=>{if(confirm('진도를 모두 초기화할까요? (되돌릴 수 없어요)')){progress={};save();render();toast('초기화했어요');}};

/* ===== 기기 간 동기화 (Firebase) =====
   여행앱과 같은 Firebase 프로젝트를 재사용하되, 규칙이 열려 있는 'trips' 컬렉션에
   'kana-' 접두어 문서로 저장 → 여행 데이터와 절대 섞이지 않고, 콘솔 설정 없이 동작. */
let fdb=null,cloudOn=false,applyingRemote=false,syncSub=null,pushT=null;
function docRef(){return fdb.collection('trips').doc('kana-'+cfg.syncCode);}
function setSyncStatus(m,c){const el=document.getElementById('syncStatus');if(el){el.textContent=m;el.style.color=c||'var(--ink3)';}}
function updateSyncUI(){
  const inp=document.getElementById('syncCode');if(inp&&!inp.value)inp.value=cfg.syncCode||'';
  const dc=document.getElementById('btnDisconnect');
  if(cloudOn&&cfg.syncCode){setSyncStatus('☁️ 연결됨 · 코드: '+cfg.syncCode,'var(--teal)');if(dc)dc.style.display='';}
  else{if(!cfg.syncCode)setSyncStatus('이 기기에만 저장 중','var(--ink3)');if(dc)dc.style.display='none';}
}
function initCloud(){
  const c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey||!window.firebase)return false;
  try{if(!firebase.apps.length)firebase.initializeApp(c);fdb=firebase.firestore();return true;}
  catch(e){console.warn('cloud init failed',e);return false;}
}
function cloudProgress(){ // Firestore에 저장할 형태(각 항목에 u 타임스탬프 보장)
  const o={};for(const k in progress){const p=progress[k];o[k]={s:p.s||0,c:p.c||0,w:p.w||0,st:p.st||0,u:p.u||0};}return o;
}
function cloudStars(){const o={};for(const k in stars){const s=stars[k];o[k]={v:s.v?1:0,u:s.u||0};}return o;}
function cloudDoc(){return {progress:cloudProgress(),stars:cloudStars(),_updatedAt:Date.now(),_kana:true};}
function syncPush(){
  if(!cloudOn||applyingRemote||!fdb||!cfg.syncCode)return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{try{docRef().set(cloudDoc());}catch(e){console.warn('push failed',e);}},600);
}
function mergeRemote(data){ // 항목별 최신(u) 우선 병합 (진도 + 즐겨찾기)
  if(!data||typeof data!=='object')return false;let changed=false;
  const rp=data.progress;
  if(rp&&typeof rp==='object')for(const k in rp){const r=rp[k];if(!r||typeof r!=='object')continue;
    const l=progress[k],ru=r.u||0,lu=l?(l.u||0):0;
    if(!l||ru>lu){progress[k]={s:r.s||0,c:r.c||0,w:r.w||0,st:r.st||0,u:ru};changed=true;}}
  const rs=data.stars;
  if(rs&&typeof rs==='object')for(const k in rs){const r=rs[k];if(!r||typeof r!=='object')continue;
    const l=stars[k],ru=r.u||0,lu=l?(l.u||0):0;
    if(!l||ru>lu){stars[k]={v:r.v?1:0,u:ru};changed=true;}}
  return changed;
}
function subscribeSync(){
  if(!cloudOn||!fdb||!cfg.syncCode)return;
  if(syncSub){syncSub();syncSub=null;}
  syncSub=docRef().onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return; // 내가 방금 쓴 반향은 무시
    if(!snap.exists)return;
    if(mergeRemote(snap.data())){applyingRemote=true;save();applyingRemote=false;render();toast('☁️ 다른 기기의 기록을 반영했어요');}
  },err=>{console.warn('snapshot err',err);setSyncStatus('동기화 오류 ['+((err&&err.code)||'?')+']','var(--bad)');});
}
async function connectSync(code,opt){
  opt=opt||{};code=(code||'').trim();
  if(code.length<6){setSyncStatus('코드는 6자 이상으로 정해 주세요','var(--bad)');return false;}
  cfg.syncCode=code;save();
  if(!fdb&&!initCloud()){setSyncStatus('지금은 오프라인이라 연결할 수 없어요. 온라인에서 다시 시도하세요.','var(--bad)');cloudOn=false;updateSyncUI();return false;}
  cloudOn=true;setSyncStatus('연결 중…','var(--gold)');
  try{
    const ref=docRef();const snap=await ref.get();
    if(snap.exists&&mergeRemote(snap.data())){applyingRemote=true;save();applyingRemote=false;render();}
    await ref.set(cloudDoc()); // 이 기기 진도·즐겨찾기도 올려 두기
    subscribeSync();updateSyncUI();
    if(!opt.silent)toast('☁️ 기기 간 동기화를 켰어요');
    return true;
  }catch(e){
    const denied=e&&e.code==='permission-denied';
    setSyncStatus(denied?'⚠️ 보안 규칙에서 막혔어요':'연결 실패 ['+((e&&e.code)||'네트워크')+']','var(--bad)');
    if(opt.silent){/* 부팅 중 조용히 실패 → 구독만이라도 시도 */subscribeSync();}
    return false;
  }
}
function disconnectSync(){
  if(syncSub){syncSub();syncSub=null;}
  cloudOn=false;cfg.syncCode='';save();
  const inp=document.getElementById('syncCode');if(inp)inp.value='';
  updateSyncUI();toast('동기화를 껐어요 (이 기기에만 저장)');
}
function makeCode(){
  const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';
  try{const arr=crypto.getRandomValues(new Uint32Array(10));for(let i=0;i<10;i++)s+=a[arr[i]%a.length];}
  catch{for(let i=0;i<10;i++)s+=a[Math.floor(Math.random()*a.length)];}
  return 'kana-'+s;
}
btnConnect.onclick=()=>connectSync(document.getElementById('syncCode').value);
btnMakeCode.onclick=()=>{const c=makeCode();const inp=document.getElementById('syncCode');inp.value=c;connectSync(c);};
btnDisconnect.onclick=disconnectSync;

/* PWA */
if('serviceWorker'in navigator){if(navigator.serviceWorker.controller){let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});}
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));}

/* boot */
buildCatChips();syncChips();render();
if(cfg.syncCode){connectSync(cfg.syncCode,{silent:true});}
updateSyncUI();
</script>
</body>
</html>
